<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кошница — онлайн магазин</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app"></div>
<button type="button" id="boxnow-widget-trigger" class="boxnow-widget-button" aria-hidden="true" tabindex="-1">BOX NOW</button>
<div id="boxnowmap"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- STATIC DELIVERY DATA ---------------- */
const OFFICES = {
  econt: {
    "София": ["Офис Econt – Център, ул. Витоша 15","Офис Econt – Младост 1, бул. Александър Малинов 78","Офис Econt – Люлин, бул. Джавахарлал Неру 28"],
    "Пловдив": ["Офис Econt – Център, ул. Иван Вазов 10","Офис Econt – Тракия, бул. Освобождение 100"],
    "Варна": ["Офис Econt – Морска градина, бул. Приморски 30","Офис Econt – Владислав Варненчик 200"],
    "Бургас": ["Офис Econt – Център, ул. Александровска 40"],
    "Русе": ["Офис Econt – Център, бул. Придунавски 20"],
    "Стара Загора": ["Офис Econt – Център, бул. Цар Симеон Велики 55"]
  },
  speedy: {},
  boxnow: {}
};
const COURIER_LABELS = { econt: "Econt", speedy: "Speedy", boxnow: "BoxNow" };
const COURIER_LOCATION_LABEL = { econt: "Офис", speedy: "Офис", boxnow: "Автомат" };
const DELIVERY_FEES = { econt: 0, speedy: 0, boxnow: 0 };
function feeLabel(fee){ return fee === 0 ? "Безплатно" : money(fee); }

/* ---------------- STATE ---------------- */
let state = {
  page: window.location.pathname.replace(/\/+$/, "") === "/admin" ? "admin" : "shop",
  products: [],
  orders: [],
  cart: [],
  isAdmin: false,
  adminPassword: null,
  adminTab: "products",
  editingProduct: null,
  checkout: { name:"", phone:"", email:"", courier:"econt", city:"", siteId:"", office:"", locationId:"", postalCode:"", note:"" },
  lastOrder: null,
  previewProductId: null,
  previewImageIndex: 0,
  previewQty: 1,
  liveOffices: [],
  officesLoading: false,
  deliveryError: "",
  econtCities: null,
  econtCitiesFetching: false
};

/* ---------------- API HELPERS ---------------- */
async function api(path, opts={}){
  const headers = Object.assign({ "Content-Type":"application/json" }, opts.headers||{});
  if(state.adminPassword) headers["x-admin-password"] = state.adminPassword;
  const res = await fetch(path, { ...opts, headers });
  if(!res.ok){
    let msg = "Възникна грешка";
    try{ msg = (await res.json()).error || msg; }catch(e){}
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  return res.json();
}
async function loadProducts(){
  state.products = await api("/api/products");
}
async function loadOrders(){
  state.orders = await api("/api/orders");
}

/* ---------------- UTIL ---------------- */
function money(n){ return n.toFixed(2) + " €"; }
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=>t.classList.remove("show"), 2400);
}
function cartCount(){ return state.cart.reduce((s,c)=>s+c.qty,0); }
function cartSubtotal(){
  return state.cart.reduce((s,c)=>{
    const p = state.products.find(p=>p.id===c.id);
    return p ? s + p.price*c.qty : s;
  },0);
}
function findProduct(id){ return state.products.find(p=>p.id===id); }
function go(page){
  state.page = page;
  const targetPath = page === "admin" ? "/admin" : "/";
  if(window.location.pathname !== targetPath){
    window.history.pushState({ page }, "", targetPath);
  }
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function normalize(s){ return (s||"").trim().toLowerCase(); }

// Full live list of towns/villages for Econt once loaded; curated sample list otherwise.
function getCityListForCourier(courier){
  if(courier === "econt" && state.econtCities && state.econtCities.length > 0){
    return state.econtCities.map(c=>c.name).sort((a,b)=>a.localeCompare(b,"bg"));
  }
  return Object.keys(OFFICES[courier]);
}

async function getEcontCities(){
  if(state.econtCities) return state.econtCities;
  try{
    const cities = await api("/api/delivery/econt/cities");
    state.econtCities = cities;
    return cities;
  }catch(e){
    state.econtCities = []; // stop retrying; getCityListForCourier falls back to the curated list
    return [];
  }
}

// Loads real Econt or Speedy offices and preserves their courier IDs.
async function fetchLiveOffices(courier, cityName, knownSiteId){
  if(courier === "econt"){
    const cities = await getEcontCities();
    const match = knownSiteId
      ? { id: knownSiteId, name: cityName }
      : cities.find(c => normalize(c.name) === normalize(cityName));
    if(!match) throw new Error("Населеното място не е намерено в Econt.");
    const offices = await api("/api/delivery/econt/offices?cityId=" + encodeURIComponent(match.id));
    return offices.map(o => ({
      id: String(o.id || ""),
      label: `Офис Econt – ${o.name}${o.address ? ", " + o.address : ""}`
    }));
  }

  if(courier === "speedy"){
    let siteId = knownSiteId;
    if(!siteId){
      const sitesRes = await api("/api/delivery/speedy/sites?name=" + encodeURIComponent(cityName));
      if(!sitesRes.configured) throw new Error("Speedy API не е конфигуриран.");
      const site = (sitesRes.sites || []).find(s => normalize(s.name) === normalize(cityName)) || (sitesRes.sites || [])[0];
      siteId = site?.id;
    }
    if(!siteId) throw new Error("Населеното място не е намерено в Speedy.");
    const officesRes = await api("/api/delivery/speedy/offices?siteId=" + encodeURIComponent(siteId));
    if(!officesRes.configured) throw new Error("Speedy API не е конфигуриран.");
    return (officesRes.offices || []).map(o => ({
      id: String(o.id || ""),
      label: `Офис Speedy – ${o.name}${o.address ? ", " + o.address : ""}`
    }));
  }

  return [];
}


/* ---------------- BOX NOW WIDGET ---------------- */
function setBoxNowLocker(selected){
  const lockerId = String(selected?.boxnowLockerId || "").trim();
  const address = String(selected?.boxnowLockerAddressLine1 || "").trim();
  const postalCode = String(selected?.boxnowLockerPostalCode || "").trim();

  if(!lockerId){
    showToast("Не успяхме да прочетем избрания BOX NOW автомат.");
    return;
  }

  const parts = [`BOX NOW автомат #${lockerId}`];
  if(address) parts.push(address);
  if(postalCode) parts.push(postalCode);
  const officeLabel = parts.join(", ");

  state.checkout.siteId = "";
  state.checkout.locationId = lockerId;
  state.checkout.postalCode = postalCode;
  // The current server requires a non-empty city field. The postcode keeps the
  // existing server.js compatible without requiring BOX NOW API credentials.
  state.checkout.city = postalCode || address || "BOX NOW";
  state.checkout.office = officeLabel;

  const selection = document.getElementById("boxnow-selected");
  if(selection){
    selection.textContent = "Избран автомат: " + officeLabel;
    selection.classList.add("selected");
  }
  const button = document.querySelector("[data-boxnow-open]");
  if(button) button.textContent = "Смени BOX NOW автомат";
  showToast("BOX NOW автоматът е избран.");
}


/* ---------------- CART ACTIONS ---------------- */
function addToCart(id, qty){
  qty = qty || 1;
  const existing = state.cart.find(c=>c.id===id);
  const product = findProduct(id);
  if(!product) return;
  const currentQty = existing ? existing.qty : 0;
  if(currentQty >= product.stock){ showToast("Няма повече наличност."); return; }
  const addQty = Math.min(qty, product.stock - currentQty);
  if(existing){ existing.qty += addQty; } else { state.cart.push({id, qty:addQty}); }
  showToast(product.name + " добавен в кошницата");
  render();
}
function closePreview(){
  state.previewProductId = null;
  render();
}
function changeQty(id, delta){
  const item = state.cart.find(c=>c.id===id);
  if(!item) return;
  const product = findProduct(id);
  item.qty += delta;
  if(item.qty <= 0){ state.cart = state.cart.filter(c=>c.id!==id); }
  else if(product && item.qty > product.stock){ item.qty = product.stock; }
  render();
}
function removeFromCart(id){ state.cart = state.cart.filter(c=>c.id!==id); render(); }

/* ---------------- CHECKOUT ---------------- */
function selectCity(cityName, knownSiteId){
  state.checkout.city = cityName;
  state.checkout.siteId = knownSiteId ? String(knownSiteId) : "";
  state.checkout.office = "";
  state.checkout.locationId = "";
  state.checkout.postalCode = "";
  state.liveOffices = [];
  state.deliveryError = "";
  state.officesLoading = Boolean(cityName);
  render();
  if(!cityName) return;

  const courier = state.checkout.courier;
  fetchLiveOffices(courier, cityName, knownSiteId)
    .then(offices => {
      if(state.checkout.courier !== courier || state.checkout.city !== cityName) return;
      state.liveOffices = offices;
      state.officesLoading = false;
      if(offices.length === 0) state.deliveryError = "Няма намерени офиси за това населено място.";
      render();
    })
    .catch(error => {
      if(state.checkout.courier !== courier || state.checkout.city !== cityName) return;
      state.liveOffices = [];
      state.officesLoading = false;
      state.deliveryError = error.message || "Офисите не можаха да бъдат заредени.";
      render();
    });
}

async function placeOrder(e){
  e.preventDefault();
  const c = state.checkout;
  if(!c.name.trim() || !c.phone.trim()){ showToast("Моля, попълнете име и телефон."); return; }
  if(!c.city || !c.office){ showToast(c.courier === "boxnow" ? "Моля, изберете BOX NOW автомат." : "Моля, изберете офис за доставка."); return; }
  if(state.cart.length===0){ showToast("Кошницата е празна."); return; }

  try{
    const order = await api("/api/orders", {
      method:"POST",
      body: JSON.stringify({
        customer: { name:c.name, phone:c.phone, email:c.email },
        delivery: { courier:c.courier, city:c.city, siteId:c.siteId || "", office:c.office, locationId:c.locationId || "", postalCode:c.postalCode || "", note:c.note },
        items: state.cart
      })
    });
    state.cart = [];
    state.lastOrder = order;
    state.checkout = { name:"", phone:"", email:"", courier:"econt", city:"", siteId:"", office:"", locationId:"", postalCode:"", note:"" };
    await loadProducts(); // refresh stock numbers
    go("confirmation");
  }catch(err){
    showToast(err.message || "Грешка при поръчката.");
  }
}

/* ---------------- ADMIN ---------------- */
async function tryAdminLogin(pw){
  try{
    const res = await fetch("/api/admin/verify", {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({password:pw})
    });
    if(!res.ok) throw new Error();
    state.adminPassword = pw;
    state.isAdmin = true;
    await loadOrders();
    render();
  }catch(e){
    showToast("Грешна парола.");
  }
}
function startEditProduct(id){
  state.editingProduct = id ? {...findProduct(id)} : { id:null, name:"", price:0, category:"", stock:0, emoji:"🛍️", desc:"", images:[], video:"" };
  render();
  setTimeout(()=>document.getElementById("admin-form-top")?.scrollIntoView({behavior:"smooth"}), 50);
}
async function saveProductForm(e){
  e.preventDefault();
  const f = state.editingProduct;
  if(!f.name.trim() || f.price<=0){ showToast("Попълнете име и валидна цена."); return; }
  try{
    if(f.id){
      await api("/api/products/"+f.id, { method:"PUT", body: JSON.stringify(f) });
    }else{
      await api("/api/products", { method:"POST", body: JSON.stringify(f) });
    }
    await loadProducts();
    showToast("Продуктът е запазен.");
    state.editingProduct = null;
    render();
  }catch(err){ showToast(err.message); }
}
async function deleteProduct(id){
  if(!confirm("Изтриване на продукта?")) return;
  try{
    await api("/api/products/"+id, { method:"DELETE" });
    await loadProducts();
    showToast("Продуктът е изтрит.");
    render();
  }catch(err){ showToast(err.message); }
}
async function moveProduct(id, direction){
  const idx = state.products.findIndex(p=>p.id===id);
  const swapIdx = idx + direction;
  if(idx===-1 || swapIdx<0 || swapIdx>=state.products.length) return;
  const arr = state.products;
  [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
  render(); // optimistic UI update
  try{
    await api("/api/products/reorder", { method:"PUT", body: JSON.stringify({ order: arr.map(p=>p.id) }) });
  }catch(err){
    showToast(err.message || "Грешка при пренареждане.");
    await loadProducts();
    render();
  }
}
async function updateOrderStatus(id, status){
  try{
    await api("/api/orders/"+id, { method:"PATCH", body: JSON.stringify({status}) });
    const o = state.orders.find(o=>o.id===id);
    if(o) o.status = status;
    render();
  }catch(err){ showToast(err.message); }
}

/* ---------------- RENDER ---------------- */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = `${Header()}<main>${Page()}</main><footer>Кошница © <a href="/admin" class="admin-entry" data-nav="admin" aria-label="Администрация">2026</a> — доставка с Econt, Speedy и BOX NOW</footer>${ProductModal()}`;
  bindEvents();
}
function Header(){
  const p = state.page;
  const navBtn = (id,label,extra="") => `<button class="nav-btn ${p===id?'active':''}" data-nav="${id}">${label}${extra}</button>`;
  return `
  <header class="topbar">
    <div class="topbar-inner">
      <div class="logo" data-nav="shop">
        <div class="logo-mark">К</div>
        <div><div class="logo-text">Кошница</div><div class="logo-sub">SHOP.BG</div></div>
      </div>
      <nav class="nav-links">
        ${navBtn("shop","Магазин")}
        ${navBtn("cart","Кошница", cartCount()>0 ? ` <span class="cart-count">${cartCount()}</span>` : "")}
      </nav>
    </div>
  </header>`;
}
function Page(){
  if(state.page==="shop") return ShopPage();
  if(state.page==="cart") return CartPage();
  if(state.page==="checkout") return CheckoutPage();
  if(state.page==="confirmation") return ConfirmationPage();
  if(state.page==="admin") return state.isAdmin ? AdminPage() : AdminLoginPage();
  return ShopPage();
}
function ShopPage(){
  return `
    <div class="hero">
      <div class="hero-inner">
        <div>
          <h1>Всичко за дома,<br>доставено бързо.</h1>
          <p>Изберете стоки и ги получете безплатно в удобен за вас офис на Econt, Speedy или автомат на BoxNow — навсякъде в България.</p>
        </div>
        <div class="hero-stamp">✓ Безплатна доставка<br>Econt · Speedy · BoxNow</div>
      </div>
    </div>
    <div class="wrap">
      <div class="section-title"><h2>Продукти</h2><span class="muted">${state.products.length} артикула</span></div>
      <div class="grid">${state.products.map(ProductCard).join("")}</div>
    </div>`;
}
function ProductCard(p){
  const inCart = state.cart.find(c=>c.id===p.id);
  const availableMore = p.stock - (inCart?inCart.qty:0);
  const thumb = (p.images && p.images[0]) ? `<img src="${escapeAttr(p.images[0])}" alt="${escapeAttr(p.name)}" loading="lazy">` : (p.emoji || "🛍️");
  return `
    <div class="card" data-preview="${p.id}">
      <div class="card-img">${thumb}</div>
      <div class="card-body">
        <div class="card-cat">${escapeHtml(p.category||"")}</div>
        <div class="card-name">${escapeHtml(p.name)}</div>
        <div class="card-desc">${escapeHtml(p.desc||"")}</div>
        ${p.stock<=5 ? `<div class="stock-low">${p.stock===0?"Изчерпан":"Само "+p.stock+" бр. в наличност"}</div>` : ""}
        <div class="card-foot">
          <span class="price">${money(p.price)}</span>
          <button class="btn btn-primary" data-add="${p.id}" data-stop-preview="1" ${availableMore<=0?"disabled":""}>+ Кошница</button>
        </div>
      </div>
    </div>`;
}

function VideoEmbed(url){
  if(!url) return "";
  const yt = url.match(/(?:youtu\.be\/|youtube\.com\/watch\?v=|youtube\.com\/embed\/)([\w-]{6,})/);
  if(yt){
    return `<div class="modal-video"><iframe src="https://www.youtube.com/embed/${yt[1]}" title="Видео на продукта" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
  }
  if(/\.mp4($|\?)/.test(url)){
    return `<div class="modal-video"><video src="${escapeAttr(url)}" controls></video></div>`;
  }
  return `<a href="${escapeAttr(url)}" target="_blank" rel="noopener" class="muted">Гледай видео →</a>`;
}

function ProductModal(){
  if(!state.previewProductId) return "";
  const p = findProduct(state.previewProductId);
  if(!p) return "";
  const images = (p.images && p.images.length) ? p.images : [];
  const idx = Math.min(state.previewImageIndex, Math.max(images.length-1,0));
  const mainImg = images[idx];
  const inCart = state.cart.find(c=>c.id===p.id);
  const availableMore = p.stock - (inCart?inCart.qty:0);
  return `
  <div class="modal-overlay" data-modal-overlay="1">
    <div class="modal">
      <button class="modal-close" data-modal-close="1">✕</button>
      <div class="modal-gallery">
        <div class="modal-main-img">${mainImg ? `<img src="${escapeAttr(mainImg)}" alt="${escapeAttr(p.name)}">` : (p.emoji||"🛍️")}</div>
        ${images.length>1 ? `<div class="modal-thumbs">${images.map((img,i)=>`<div class="modal-thumb ${i===idx?'active':''}" data-thumb="${i}"><img src="${escapeAttr(img)}" alt=""></div>`).join("")}</div>` : ""}
        ${VideoEmbed(p.video)}
      </div>
      <div class="modal-body">
        <div class="modal-cat">${escapeHtml(p.category||"")}</div>
        <div class="modal-title">${escapeHtml(p.name)}</div>
        <div class="modal-price">${money(p.price)}</div>
        <div class="modal-desc">${escapeHtml(p.desc||"Няма добавено описание.")}</div>
        <div class="modal-stock ${p.stock<=5?'stock-low':'muted'}">${p.stock===0?"Изчерпан":"В наличност: "+p.stock+" бр."}</div>
        <div class="modal-actions">
          <div class="qty-box">
            <button data-modal-qty-minus="1">−</button>
            <span>${state.previewQty}</span>
            <button data-modal-qty-plus="1">+</button>
          </div>
          <button class="btn btn-accent" data-modal-add="${p.id}" ${availableMore<=0?"disabled":""}>Добави в кошницата</button>
        </div>
      </div>
    </div>
  </div>`;
}
function CartPage(){
  if(state.cart.length===0){
    return `<div class="wrap"><div class="empty"><div class="em">🧺</div><h3>Кошницата е празна</h3><p class="muted">Разгледайте продуктите и добавете нещо хубаво.</p>
    <div style="margin-top:16px;"><button class="btn btn-primary" data-nav="shop">Към магазина</button></div></div></div>`;
  }
  const subtotal = cartSubtotal();
  return `
  <div class="wrap">
    <div class="section-title"><h2>Кошница</h2><span class="muted">${cartCount()} артикула</span></div>
    <div class="two-col">
      <div class="panel">
        ${state.cart.map(c=>{
          const p = findProduct(c.id); if(!p) return "";
          return `
          <div class="cart-row">
            <div class="card-img">${p.emoji}</div>
            <div class="cart-info"><div class="name">${escapeHtml(p.name)}</div><div class="unit">${money(p.price)} / бр.</div></div>
            <div class="qty-box"><button data-qty-minus="${p.id}">−</button><span>${c.qty}</span><button data-qty-plus="${p.id}">+</button></div>
            <div class="price" style="width:80px; text-align:right;">${money(p.price*c.qty)}</div>
            <button class="btn btn-danger" data-remove="${p.id}">✕</button>
          </div>`;
        }).join("")}
      </div>
      <div class="panel">
        <h3 style="margin-bottom:10px;">Обобщение</h3>
        <div class="cart-total-line"><span>Междинна сума</span><span class="mono">${money(subtotal)}</span></div>
        <div class="cart-total-line"><span>Доставка</span><span class="mono">Безплатно</span></div>
        <div class="cart-total-line grand"><span>Общо</span><span class="mono">${money(subtotal)}</span></div>
        <button class="btn btn-accent btn-block" style="margin-top:16px;" data-nav="checkout">Продължи към доставка →</button>
      </div>
    </div>
  </div>`;
}
function CheckoutPage(){
  if(state.cart.length===0){ return CartPage(); }
  const c = state.checkout;

  // Econt uses the complete live settlement list from the existing backend.
  if(c.courier === "econt" && state.econtCities === null && !state.econtCitiesFetching){
    state.econtCitiesFetching = true;
    getEcontCities().then(()=>{ state.econtCitiesFetching = false; render(); });
  }
  // Speedy's API only returns up to 10 matches per search (no bulk listing endpoint),
  // so its city field searches live as you type instead of preloading a full list — see bindEvents().

  const isBoxNow = c.courier === "boxnow";
  const cities = isBoxNow ? [] : getCityListForCourier(c.courier);
  const fallbackOffices = (!isBoxNow && c.city && OFFICES[c.courier]?.[c.city])
    ? OFFICES[c.courier][c.city].map(label => ({ id:"", label }))
    : [];
  const offices = state.liveOffices.length ? state.liveOffices : fallbackOffices;
  const subtotal = cartSubtotal();
  const fee = DELIVERY_FEES[c.courier];
  const locLabel = COURIER_LOCATION_LABEL[c.courier];

  return `
  <div class="wrap">

        }).join("")}

        <div class="cart-total-line grand"><span>Общо</span><span class="mono">${money(subtotal+fee)}</span></div>

}

/* ---------------- ESCAPE HELPERS ---------------- */
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])); }
function escapeAttr(s){ return escapeHtml(s); }

/* ---------------- EVENT BINDING ---------------- */
function bindEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>el.addEventListener("click", (event)=>{
    event.preventDefault();
    go(el.getAttribute("data-nav"));
  }));
  document.querySelectorAll("[data-add]").forEach(el=>el.addEventListener("click", (ev)=>{
    if(el.hasAttribute("data-stop-preview")) ev.stopPropagation();
    addToCart(el.getAttribute("data-add"));
  }));
  document.querySelectorAll("[data-preview]").forEach(el=>el.addEventListener("click", ()=>{
    state.previewProductId = el.getAttribute("data-preview");
    state.previewImageIndex = 0;
    state.previewQty = 1;
    render();
  }));
  document.querySelectorAll("[data-modal-overlay]").forEach(el=>el.addEventListener("click", (ev)=>{
    if(ev.target === el){ closePreview(); }
  }));
  document.querySelectorAll("[data-modal-close]").forEach(el=>el.addEventListener("click", closePreview));
  document.querySelectorAll("[data-thumb]").forEach(el=>el.addEventListener("click", ()=>{
    state.previewImageIndex = parseInt(el.getAttribute("data-thumb"));
    render();
  }));
  document.querySelectorAll("[data-modal-qty-plus]").forEach(el=>el.addEventListener("click", ()=>{
    const p = findProduct(state.previewProductId);
    if(p) state.previewQty = Math.min(state.previewQty+1, p.stock || 1);
    render();
  }));
  document.querySelectorAll("[data-modal-qty-minus]").forEach(el=>el.addEventListener("click", ()=>{
    state.previewQty = Math.max(1, state.previewQty-1);
    render();
  }));
  document.querySelectorAll("[data-modal-add]").forEach(el=>el.addEventListener("click", ()=>{
    const id = el.getAttribute("data-modal-add");
    addToCart(id, state.previewQty);
    closePreview();
  }));
  document.querySelectorAll("[data-qty-plus]").forEach(el=>el.addEventListener("click", ()=>changeQty(el.getAttribute("data-qty-plus"), 1)));
  document.querySelectorAll("[data-qty-minus]").forEach(el=>el.addEventListener("click", ()=>changeQty(el.getAttribute("data-qty-minus"), -1)));
  document.querySelectorAll("[data-remove]").forEach(el=>el.addEventListener("click", ()=>removeFromCart(el.getAttribute("data-remove"))));
  document.querySelectorAll("[data-courier]").forEach(el=>el.addEventListener("click", ()=>{
    persistCheckoutFields();
    state.checkout.courier = el.getAttribute("data-courier");
    state.checkout.city = "";
    state.checkout.siteId = "";
    state.checkout.office = "";
    state.checkout.locationId = "";
    state.checkout.postalCode = "";
    state.liveOffices = [];
    state.officesLoading = false;
    state.deliveryError = "";
    render();
  }));

  document.querySelectorAll("[data-boxnow-open]").forEach(el=>el.addEventListener("click", ()=>{
    persistCheckoutFields();
    if(window.__boxnowWidgetFailed){
      showToast("BOX NOW картата не можа да се зареди. Проверете интернет връзката.");
      return;
    }
    const trigger = document.getElementById("boxnow-widget-trigger");
    if(trigger) trigger.click();
  }));

  const cityEl = document.getElementById("f-city");
  const cityListEl = document.getElementById("city-combo-list");
  if(cityEl && cityListEl){
    const courier = state.checkout.courier;
    const allCities = courier === "econt" ? (state.econtCities || []) : null;
    let searchToken = 0; // guards against a slow older request overwriting a newer one

    const bindItemHandlers = () => {
      cityListEl.querySelectorAll("[data-city]").forEach(el=>{
        el.addEventListener("mousedown", (ev)=>{ // mousedown fires before blur, so the click registers
          ev.preventDefault();
          const chosen = el.getAttribute("data-city");
          const siteId = el.getAttribute("data-site-id");
          cityEl.value = chosen;
          cityListEl.classList.remove("open");
          persistCheckoutFields();
          selectCity(chosen, siteId ? Number(siteId) : null);
        });
      });
    };
    const showMessage = (msg) => {
      cityListEl.innerHTML = `<div class="city-combo-item empty">${msg}</div>`;
      cityListEl.classList.add("open");
    };
    const showMatches = (items) => { // items: [{name, id?}]
      if(items.length === 0){
        showMessage("Няма съвпадения");
        return;
      }
      cityListEl.innerHTML = items.slice(0, 200).map(it =>
        `<div class="city-combo-item" data-city="${escapeAttr(it.name)}" ${it.id!=null ? `data-site-id="${it.id}"` : ""}>${escapeHtml(it.name)}</div>`
      ).join("");
      cityListEl.classList.add("open");
      bindItemHandlers();
    };

    const runSearch = async (rawValue) => {
      const q = rawValue.trim();
      if(courier === "econt"){
        if(q.length === 0){
          showMessage(`Пишете, за да търсите сред ${allCities.length} населени места...`);
          return;
        }
        const matches = allCities.filter(city => normalize(city.name).includes(normalize(q))).map(city=>({name:city.name, id:city.id}));
        showMatches(matches);
        return;
      }
      if(courier === "speedy"){
        if(q.length < 2){
          showMessage("Въведете поне 2 букви...");
          return;
        }
        showMessage("Търсене...");
        const myToken = ++searchToken;
        try{
          const res = await api("/api/delivery/speedy/sites?name=" + encodeURIComponent(q));
          if(myToken !== searchToken) return; // a newer keystroke already started a fresher search
          if(!res.configured){
            showMessage("Speedy API не е конфигуриран на сървъра.");
            return;
          }
          showMatches((res.sites || []).map(s => ({ name: s.name, id: s.id })));
        }catch(e){
          if(myToken === searchToken) showMessage("Грешка при търсене. Опитайте отново.");
        }
        return;
      }
      showMatches([]);
    };

    let debounceTimer = null;
    cityEl.addEventListener("focus", ()=>runSearch(cityEl.value));
    cityEl.addEventListener("input", ()=>{
      clearTimeout(debounceTimer);
      const val = cityEl.value;
      debounceTimer = setTimeout(()=>runSearch(val), courier === "speedy" ? 350 : 0);
    });
    cityEl.addEventListener("blur", ()=>{ setTimeout(()=>cityListEl.classList.remove("open"), 150); });
    cityEl.addEventListener("keydown", (ev)=>{
      if(ev.key === "Enter"){
        ev.preventDefault();
        const items = cityListEl.querySelectorAll("[data-city]");
        if(items.length === 1) items[0].dispatchEvent(new Event("mousedown", {cancelable:true}));
      }else if(ev.key === "Escape"){
        cityListEl.classList.remove("open");
      }
    });
  }
  const officeEl = document.getElementById("f-office");
  if(officeEl) officeEl.addEventListener("change", ()=>{
    const option = officeEl.options[officeEl.selectedIndex];
    state.checkout.locationId = option?.getAttribute("data-office-id") || "";
    state.checkout.office = option?.getAttribute("data-office-label") || option?.textContent || "";
    if(!officeEl.value) state.checkout.office = "";
  });

  const checkoutForm = document.getElementById("checkout-form");
  if(checkoutForm) checkoutForm.addEventListener("submit", (e)=>{ persistCheckoutFields(); placeOrder(e); });

  const adminLoginForm = document.getElementById("admin-login-form");
  if(adminLoginForm) adminLoginForm.addEventListener("submit", (e)=>{ e.preventDefault(); tryAdminLogin(document.getElementById("admin-pw").value); });

  document.querySelectorAll("[data-admin-logout]").forEach(el=>el.addEventListener("click", ()=>{ state.isAdmin=false; state.adminPassword=null; go("shop"); }));
  document.querySelectorAll("[data-admin-tab]").forEach(el=>el.addEventListener("click", ()=>{ state.adminTab = el.getAttribute("data-admin-tab"); render(); }));
  document.querySelectorAll("[data-new-product]").forEach(el=>el.addEventListener("click", ()=>startEditProduct(null)));
  document.querySelectorAll("[data-edit-product]").forEach(el=>el.addEventListener("click", ()=>startEditProduct(el.getAttribute("data-edit-product"))));
  document.querySelectorAll("[data-delete-product]").forEach(el=>el.addEventListener("click", ()=>deleteProduct(el.getAttribute("data-delete-product"))));
  document.querySelectorAll("[data-cancel-edit]").forEach(el=>el.addEventListener("click", ()=>{ state.editingProduct=null; render(); }));
  document.querySelectorAll("[data-move-up]").forEach(el=>el.addEventListener("click", ()=>moveProduct(el.getAttribute("data-move-up"), -1)));
  document.querySelectorAll("[data-move-down]").forEach(el=>el.addEventListener("click", ()=>moveProduct(el.getAttribute("data-move-down"), 1)));
  document.querySelectorAll("[data-order-status]").forEach(el=>el.addEventListener("change", ()=>updateOrderStatus(el.getAttribute("data-order-status"), el.value)));

  const productForm = document.getElementById("product-form");
  if(productForm) productForm.addEventListener("submit", (e)=>{
    const f = state.editingProduct;
    f.name = document.getElementById("pf-name").value;
    f.category = document.getElementById("pf-category").value;
    f.price = parseFloat(document.getElementById("pf-price").value) || 0;
    f.stock = parseInt(document.getElementById("pf-stock").value) || 0;
    f.emoji = document.getElementById("pf-emoji").value;
    f.desc = document.getElementById("pf-desc").value;
    f.images = document.getElementById("pf-images").value.split("\n").map(s=>s.trim()).filter(Boolean);
    f.video = document.getElementById("pf-video").value.trim();
    saveProductForm(e);
  });
}
function persistCheckoutFields(){
  const g = id => document.getElementById(id);
  if(g("f-name")) state.checkout.name = g("f-name").value;
  if(g("f-phone")) state.checkout.phone = g("f-phone").value;
  if(g("f-email")) state.checkout.email = g("f-email").value;
  if(g("f-note")) state.checkout.note = g("f-note").value;
}

  parentElement: "#boxnowmap",
  buttonSelector: ".boxnow-widget-button",

  autoselect: false,
  autoclose: true,
  afterSelect: setBoxNowLocker
};

  state.page = window.location.pathname.replace(/\/+$/, "") === "/admin" ? "admin" : "shop";
  render();
  window.scrollTo({top:0});
});

/* ---------------- INIT ---------------- */
async function init(){
  document.getElementById("app").innerHTML = `<div class="wrap"><p class="muted" style="padding:60px 0; text-align:center;">Зареждане…</p></div>`;
  try{ await loadProducts(); }catch(e){ state.products = []; }
  render();
}
init();
</script>
